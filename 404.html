.plate{width:.92em;height:.92em;flex:none;filter:drop-shadow(0 14px 22px #00000038)}
.plate .rim{fill:var(--plate);stroke:var(--plate-rim);stroke-width:2}
.plate .well{fill:var(--plate-well);stroke:var(--plate-rim);stroke-width:1.5}
.plate .garnish{fill:var(--leafc);transform-origin:60px 60px;animation:wobble 5s ease-in-out infinite}
.plate .crumb-a{fill:var(--paprika)}.plate .crumb-b{fill:var(--saffron)}

.code::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}

p{margin:0}
.lede{color:var(--muted);font-size:18px;max-width:30em}
nav{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-top:28px}
nav a{display:inline-flex;align-items:center;min-height:44px;font-weight:650;text-decoration-thickness:1.5px;text-underline-offset:4px}
.button{gap:10px;padding:0 22px;min-height:52px;border-radius:999px;background:var(--accent);color:var(--on-accent);text-decoration:none;font-size:16px;transition:transform .15s}
.button:hover{transform:translateY(-1px)}
.button svg{width:18px;height:18px}
#privacy{color:var(--fg)}
.languages{gap:4px;margin-top:44px;padding-top:20px;border-top:1px solid var(--line);font-size:14px}
.languages a{padding:0 14px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:600}
.languages a:hover{color:var(--fg);background:var(--surface)}
.languages a:first-child{margin-left:-14px}
.social{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0;padding:0;list-style:none}
.social a{display:grid;place-items:center;width:44px;height:44px;border-radius:999px;border:1px solid var(--line);color:var(--muted);transition:color .15s,border-color .15s,background-color .15s}
.social a:hover{color:var(--fg);background:var(--surface)}
.social a:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.plate .garnish{animation:none}.button,.social a{transition:none}}
