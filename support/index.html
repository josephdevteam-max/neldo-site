<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NELDO Support</title>
<meta name="description" content="Get help with NELDO: email support, read the FAQ, or find NELDO on social.">
<meta property="og:title" content="NELDO Support">
<meta property="og:description" content="Email support, read the FAQ, or find NELDO on social.">
<meta property="og:image" content="https://www.neldo.app/og-card.png">
<meta property="og:url" content="https://www.neldo.app/support/">
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#faf7ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1813" media="(prefers-color-scheme: dark)">
<style>
@font-face{font-family:"DM Sans";src:url(/assets/fonts/DMSans.woff2) format("woff2");font-weight:100 1000;font-display:swap}
:root{--bg:#faf7ef;--card:#ffffff;--ink:#172b24;--soft:#5c6c62;--line:#e4e8df;--brand:#234d3b;--leaf:#6e9a1e;--btn:#f2f4ee;--btn-ink:#172b24}
@media (prefers-color-scheme:dark){:root{--bg:#0d1813;--card:#14231c;--ink:#eef3ec;--soft:#a7b6ac;--line:#24382d;--brand:#7fb069;--leaf:#9cc34a;--btn:#1b2e24;--btn-ink:#eef3ec}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.5 "DM Sans",Arial,sans-serif;display:flex;justify-content:center;padding:32px 16px}
main{width:100%;max-width:420px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px 22px 22px;text-align:center;box-shadow:0 10px 40px #142b2012}
.logo{width:64px;height:70px;display:block;margin:0 auto 14px}
h1{font-size:26px;line-height:1.2;margin:0;letter-spacing:-.5px}
.role{color:var(--soft);font-size:14px;margin:4px 0 0}
.tag{font-weight:700;margin:16px 0 2px;font-size:15px}
.free{color:var(--leaf);font-weight:700;font-size:13px;margin:0 0 20px}
.btns{display:grid;gap:10px}
.btn{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:14px;background:var(--btn);color:var(--btn-ink);text-decoration:none;font-weight:700;font-size:15px;border:1px solid var(--line)}
.btn img{width:28px;height:28px}
.btn span{flex:1;text-align:left}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
@media (prefers-color-scheme:dark){.btn.primary{color:#0d1813}}
.btn:hover{filter:brightness(.97)}
.social{display:flex;justify-content:center;gap:10px;margin:20px 0 4px;flex-wrap:wrap}
.social a img{width:38px;height:38px;display:block}
.label{font-size:12px;color:var(--soft);margin:18px 0 0;letter-spacing:.4px}
.foot{text-align:center;font-size:12px;color:var(--soft);margin-top:16px}
.foot a{color:var(--soft)}
</style>
</head>
<body>
<main>
  <div class="card">
    <img class="logo" src="/assets/sig/leaf-n-big.png" alt="NELDO">
    <h1>NELDO Support</h1>
    <p class="role">Real people, here to help</p>
    <p class="tag">Your culture. Your cravings. Good food.</p>
    <p class="free">Free help with meals. No sign-ups.</p>
    <div class="btns">
      <a class="btn primary" href="mailto:support@neldo.app"><span>Email support@neldo.app</span>&rarr;</a>
      <a class="btn" href="https://www.neldo.app/#faq"><img src="/assets/sig/web.png" alt=""><span>Help &amp; FAQ</span></a>
    </div>
    <p class="label">FOLLOW NELDO</p>
    <div class="social">
      <a href="https://www.instagram.com/getneldo/" aria-label="Instagram"><img src="/assets/sig/instagram.png" alt="Instagram"></a>
      <a href="https://www.tiktok.com/@getneldo" aria-label="TikTok"><img src="/assets/sig/tiktok.png" alt="TikTok"></a>
      <a href="https://www.youtube.com/@getneldo" aria-label="YouTube"><img src="/assets/sig/youtube.png" alt="YouTube"></a>
      <a href="https://www.facebook.com/getneldo" aria-label="Facebook"><img src="/assets/sig/facebook.png" alt="Facebook"></a>
      <a href="https://x.com/getneldo" aria-label="X"><img src="/assets/sig/x.png" alt="X"></a>
      <a href="https://www.linkedin.com/company/getneldo" aria-label="NELDO on LinkedIn"><img src="/assets/sig/linkedin.png" alt="LinkedIn"></a>
    </div>
  </div>
  <p class="foot"><a href="https://www.neldo.app/">www.neldo.app</a></p>
</main>
</body>
</html>
