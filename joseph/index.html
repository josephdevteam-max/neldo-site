<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joseph Cruz | NELDO</title>
<meta name="description" content="Joseph Cruz, founder of NELDO. Free help with meals, from idea to plate. Save my contact or find me on social.">
<meta property="og:title" content="Joseph Cruz | Founder, NELDO">
<meta property="og:description" content="Save my contact, email me, or find NELDO on social.">
<meta property="og:image" content="https://www.neldo.app/og-card.png">
<meta property="og:url" content="https://www.neldo.app/joseph/">
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0a1611">
<style>
@font-face{font-family:"DM Sans";src:url(/assets/fonts/DMSans.woff2) format("woff2");font-weight:100 1000;font-display:swap}
:root{--bg:#0a1611;--card:#10221a;--ink:#ffffff;--soft:#cfd9d2;--line:#1f3a2c;--brand:#a8d832;--leaf:#a8d832;--btn:#183126;--btn-ink:#ffffff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.5 "DM Sans",Arial,sans-serif;display:flex;justify-content:center;padding:32px 16px}
main{width:100%;max-width:420px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px 22px 22px;text-align:center;box-shadow:0 10px 40px #142b2012}
.logo{width:64px;height:70px;display:block;margin:0 auto 14px}
h1{font-size:30px;line-height:1.15;margin:0;letter-spacing:-.6px;font-weight:900}
.role{color:var(--leaf);font-weight:700;font-size:14px;margin:6px 0 0}
.tag{font-weight:700;margin:16px 0 2px;font-size:15px}
.free{color:var(--leaf);font-weight:700;font-size:13px;margin:0 0 20px}
.btns{display:grid;gap:10px}
.btn{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:14px;background:var(--btn);color:var(--btn-ink);text-decoration:none;font-weight:700;font-size:15px;border:1px solid var(--line)}
.btn img{width:28px;height:28px}
.btn span{flex:1;text-align:left}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.primary{color:#10221a;font-weight:900}
.btn:hover{filter:brightness(.97)}
.social{display:flex;justify-content:center;gap:10px;margin:20px 0 4px;flex-wrap:wrap}
.social a img{width:38px;height:38px;display:block}
.label{font-size:12px;color:var(--soft);margin:18px 0 0;letter-spacing:.4px}
.foot{text-align:center;font-size:12px;color:var(--soft);margin-top:16px}
.foot a{color:var(--soft)}
</style>
</head>
<body>
<main>
  <div class="card">
    <img class="logo" src="/assets/sig/leaf-n-pop.png" alt="NELDO">
    <h1>Joseph Cruz</h1>
    <p class="role">Founder of NELDO / Disabled Vet / AI for the people</p>
    <p class="tag" style="font-style:italic">Your culture. Your cravings. Good food.</p>
    <p class="free">Free help with meals. No sign-ups.</p>
    <div class="btns">
      <a class="btn primary" href="/joseph/joseph-cruz.vcf" download><span>Save my contact</span>&#8595;</a>
      <a class="btn" href="mailto:joseph@neldo.app"><img src="/assets/sig/mail-pop.png" alt=""><span>Joseph@neldo.app</span></a>
      <a class="btn" href="https://www.linkedin.com/in/joseph-cruz-5008b9137/" id="li-me"><img src="/assets/sig/linkedin-pop.png" alt=""><span>Connect on LinkedIn</span></a>
      <a class="btn" href="https://www.neldo.app/"><img src="/assets/sig/web-pop.png" alt=""><span>neldo.app</span></a>
    </div>
    <p class="label">FOLLOW NELDO</p>
    <div class="social">
      <a href="https://www.instagram.com/getneldo/" aria-label="Instagram"><img src="/assets/sig/instagram-pop.png" alt="Instagram"></a>
      <a href="https://www.tiktok.com/@getneldo" aria-label="TikTok"><img src="/assets/sig/tiktok-pop.png" alt="TikTok"></a>
      <a href="https://www.youtube.com/@getneldo" aria-label="YouTube"><img src="/assets/sig/youtube-pop.png" alt="YouTube"></a>
      <a href="https://www.facebook.com/getneldo" aria-label="Facebook"><img src="/assets/sig/facebook-pop.png" alt="Facebook"></a>
      <a href="https://x.com/getneldo" aria-label="X"><img src="/assets/sig/x-pop.png" alt="X"></a>
      <a href="https://www.linkedin.com/company/getneldo" aria-label="NELDO on LinkedIn"><img src="/assets/sig/linkedin-pop.png" alt="LinkedIn"></a>
    </div>
  </div>
  <p class="foot"><a href="https://www.neldo.app/">www.neldo.app</a></p>
</main>
</body>
</html>
